worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        # Preserve the browser's public HTTPS origin when this internal HTTP
        # listener adds the canonical trailing slash behind the load balancer.
        absolute_redirect off;
        root /usr/share/nginx/html;

        location = /finance_assistant {
            return 308 /finance_assistant/;
        }

        location = /finance_assistant/healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # The load balancer owns API routing; never turn a missed API route into index.html.
        location = /finance_assistant/api {
            return 404;
        }

        location /finance_assistant/api/ {
            return 404;
        }

        location /finance_assistant/ {
            try_files $uri $uri/ /finance_assistant/index.html;
        }

        location / {
            return 404;
        }
    }
}


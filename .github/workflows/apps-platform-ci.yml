name: App Platform checks

on:
  pull_request:
    paths:
      - "apps-platform/**"
      - ".github/workflows/apps-platform-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps-platform/**"
      - ".github/workflows/apps-platform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-platform-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Standalone governance checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.12
      - name: Run credential-free standalone checks
        run: make -C apps-platform check

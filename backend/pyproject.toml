[project]
name = "ai-finance-assistant-backend"
version = "0.1.0"
description = "FastAPI backend and offline knowledge pipeline for AI Finance Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "fastapi>=0.162,<0.163",
  "httpx>=0.28,<0.29",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres==3.2.0",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "langsmith>=0.4,<1",
  "mcp>=2.2,<3",
  "numpy>=2.1,<2.4",
  "openai>=3.40,<4",
  "openpyxl>=3.1,<4",
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
  "opentelemetry-instrumentation-httpx>=0.59b0,<1",
  "opentelemetry-sdk>=1.38,<2",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.12,<3",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "pypdf>=6.6,<7",
  "pyjwt[crypto]>=2.10,<3",
  "qdrant-client[fastembed]>=1.20,<1.21",
  "redisvl==0.31.0",
  "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.15,<3",
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_finance_assistant"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not live_provider and not live_model and not redis'"
testpaths = ["tests"]
markers = [
  "qdrant: requires the explicitly configured local Qdrant integration service",
  "live_provider: makes explicitly enabled calls to approved external provider accounts",
  "live_model: makes explicitly enabled calls to an approved external model account",
  "redis: requires the explicitly configured local Redis response-cache service",
  "postgres: requires an explicitly configured disposable PostgreSQL qualification schema",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "redisvl.*", "uvicorn.*"]
ignore_missing_imports = true

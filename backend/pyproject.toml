[project]
name = "ai-finance-assistant-backend"
version = "0.1.0"
description = "FastAPI backend and offline knowledge pipeline for AI Finance Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "fastapi>=0.162,<0.163",
  "numpy>=2.1,<2.4",
  "openpyxl>=3.1,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.12,<3",
  "pypdf>=6.6,<7",
  "qdrant-client[fastembed]>=1.20,<1.21",
  "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.15,<3",
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_finance_assistant"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "qdrant: requires the explicitly configured local Qdrant integration service",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "uvicorn.*"]
ignore_missing_imports = true
